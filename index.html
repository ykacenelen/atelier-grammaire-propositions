'<p><strong>Juxtaposées</strong> : séparées par une ponctuation (virgule, point-virgule, deux-points), sans mot de liaison.</p>'+
'<p><strong>Coordonnées</strong> : reliées par une conjonction de coordination (mais, ou, et, donc, or, ni, car).</p>'+
'<p><strong>Subordonnée</strong> : dépend d\'une proposition principale ; introduite par un pronom relatif (qui, que, dont, où, lequel…) ou une conjonction de subordination (que, quand, si, parce que, bien que…).</p>'+
'<p><strong>Astuce</strong> : compte les verbes conjugués. Un « et » entre deux groupes de mots sans verbe (« aux spectateurs et au jury ») ne coordonne pas deux propositions.</p></div></details>';
function cardHTML(i){
  var q=BANK[i],a=ans(i),r=S.res[i],locked=r==="ok";
  var cls="q"+(r==="ok"?" ok":r?" ko":"");
  var dis=locked?" disabled":"";
  var h='<article class="'+cls+'" id="q'+i+'" data-i="'+i+'"><div class="qh"><span class="num">'+(S.blocks[S.b].indexOf(i)+1)+'</span><p class="s">'+esc(q[0])+'</p></div>';
  h+='<div class="opts" role="radiogroup" aria-label="Nature de la phrase">';
  h+='<label class="opt"><input type="radio" name="n'+i+'" value="S"'+(a.t==="S"?" checked":"")+dis+'><span>Phrase simple</span></label>';
  h+='<label class="opt"><input type="radio" name="n'+i+'" value="C"'+(a.t==="C"?" checked":"")+dis+'><span>Phrase complexe</span></label></div>';
  h+='<div class="subs"'+(a.t==="C"?"":" hidden")+'><p class="lbl">Elle contient des propositions…</p><div class="chips">';
  [["c","coordonnées"],["j","juxtaposées"],["s","subordonnées"]].forEach(function(x){
    h+='<label class="chip"><input type="checkbox" data-k="'+x[0]+'"'+(a.k[x[0]]?" checked":"")+dis+'><span>'+x[1]+'</span></label>'});
  h+='</div></div><p class="fb" '+(r?"":"hidden")+'>'+fbText(i)+'</p></article>';
  return h;
}
function fbText(i){
  var r=S.res[i];if(!r)return"";
  if(r==="ok")return '<span class="ok">✓ Correct.</span><small>'+esc(BANK[i][2])+'</small>';
  if(r==="ko-t")return '✗ La nature de la phrase est à revoir. Combien de verbes conjugués ?';
  return '✗ Phrase complexe, oui, mais les types de propositions sont à revoir.';
}
function renderQuiz(){
  var ids=S.blocks[S.b];
  var meta='<div class="meta"><span>Bloc <b>'+(S.b+1)+'</b> / '+N+'</span>'+
    '<span>'+(S.tries[S.b]?'Essai '+S.tries[S.b]+' · dernière validation : <b>'+S.last+'/10</b>':'Réponds aux 10 phrases')+'</span></div>';
  if(S.scores[S.b]!==null)meta+='<div class="meta"><span>Score enregistré (1er essai) : <b>'+S.scores[S.b]+'/10</b></span></div>';
  var h=head()+meta+(S.b===0?MEMO:"")+'<div class="list">';
  ids.forEach(function(i){h+=cardHTML(i)});
  h+='</div><div class="bar"><button type="button" id="val">Valider</button><button type="button" class="alt" id="nxt">'+(S.b===N-1?"Résultat":"Suivant")+' →</button></div>';
  app.innerHTML=h;
  refreshBar();
}
function refreshBar(){
  var v=document.getElementById("val"),n=document.getElementById("nxt");if(!v)return;
  var ok=allOk();
  v.disabled=!complete()||ok;
  n.disabled=!ok;
}
function setMeta(){ /* met à jour la ligne d'état sans tout redessiner */
  var m=app.querySelectorAll(".meta");
  if(m[0])m[0].innerHTML='<span>Bloc <b>'+(S.b+1)+'</b> / '+N+'</span><span>Essai '+S.tries[S.b]+' · dernière validation : <b>'+S.last+'/10</b></span>';
  if(S.scores[S.b]!==null){
    var t='<span>Score enregistré (1er essai) : <b>'+S.scores[S.b]+'/10</b></span>';
    if(m[1])m[1].innerHTML=t;else m[0].insertAdjacentHTML("afterend",'<div class="meta">'+t+'</div>');
  }
}
function updateCard(i){
  var el=document.getElementById("q"+i),a=ans(i);
  el.querySelector(".subs").hidden=a.t!=="C";
  if(S.res[i]&&S.res[i]!=="ok"){delete S.res[i];el.className="q";var f=el.querySelector(".fb");f.hidden=true;f.innerHTML=""}
}
function validate(){
  var ids=S.blocks[S.b],ok=0;
  ids.forEach(function(i){
    if(S.res[i]==="ok"){ok++;return}
    var q=BANK[i],a=ans(i),exp=q[1],good=false,why="t";
    if(exp===""){good=a.t==="S"}
    else if(a.t==="C"){why="k";var got=["c","j","s"].filter(function(x){return a.k[x]}).sort().join("");good=got===exp.split("").sort().join("")}
    S.res[i]=good?"ok":"ko-"+why;if(good)ok++;
  });
  S.tries[S.b]++;S.last=ok;if(S.tries[S.b]===1)S.scores[S.b]=ok;
  save();
  ids.forEach(function(i){
    var el=document.getElementById("q"+i),r=S.res[i];
    el.className="q "+(r==="ok"?"ok":"ko");
    var f=el.querySelector(".fb");f.hidden=false;f.className="fb "+(r==="ok"?"ok":"ko");f.innerHTML=fbText(i);
    if(r==="ok")el.querySelectorAll("input").forEach(function(x){x.disabled=true});
  });
  setMeta();refreshBar();
  var first=app.querySelector(".q.ko");
  if(first)first.scrollIntoView({behavior:"smooth",block:"center"});
}
function renderResult(){
  var tot=S.scores.reduce(function(a,b){return a+(b||0)},0);
  var h=head()+'<div class="total"><span class="big">'+tot+'</span><span>/ 50 · somme des scores du premier essai</span></div>';
  var msg=tot>=45?"Excellent : tu maîtrises ces notions.":tot>=35?"Bien : encore un tour pour fixer les derniers pièges.":tot>=25?"Des bases solides, mais relis le rappel de cours puis recommence.":"Relis le rappel de cours, puis recommence : tu progresseras vite.";
  h+='<p class="sub">'+msg+'</p><div class="card"><table><thead><tr><th>Bloc</th><th>Essais</th><th>Score (1er essai)</th></tr></thead><tbody>';
  for(var i=0;i<N;i++)h+='<tr><td>Bloc '+(i+1)+'</td><td>'+S.tries[i]+'</td><td><b>'+S.scores[i]+' / 10</b></td></tr>';
  h+='</tbody></table></div>'+MEMO+'<div class="bar"><button type="button" id="again">Recommencer</button></div>';
  app.innerHTML=h;
}
function render(){window.scrollTo(0,0);if(S.phase==="result")renderResult();else renderQuiz()}
app.addEventListener("change",function(e){
  var t=e.target,card=t.closest(".q");if(!card)return;
  var i=+card.getAttribute("data-i"),a=ans(i);
  if(t.type==="radio"){a.t=t.value}
  else if(t.getAttribute("data-k")){a.k[t.getAttribute("data-k")]=t.checked}
  save();updateCard(i);refreshBar();
});
app.addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;
  if(b.id==="val")validate();
  else if(b.id==="nxt"){if(S.b<N-1){S.b++;S.last=null}else S.phase="result";save();render()}
  else if(b.id==="again"){S=newRound(S.seen,S.round+1);save();render()}
});
S=load();
if(!S||!S.blocks||S.blocks.length!==N||S.blocks.some(function(b){return b.some(function(i){return !BANK[i]})}))S=newRound([],1);
save();render();
if("serviceWorker" in navigator&&location.protocol.indexOf("http")===0&&window.__PWA__){navigator.serviceWorker.register("sw.js").catch(function(){})}
})();
</script>
</body></html>
